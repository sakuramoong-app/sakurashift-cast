<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>サクラシフト（テスト）</title>
<link rel="icon" href="favicon.png">
<meta name="theme-color" content="#FF9EC0">
<!-- 🧪 キャスト用の新しい画面のテスト（2026/11/23）。いまは「見本のデータ」だけ。本物の予約・精算・お客さんは読まない・書かない。
     A＝上の切りかえ＋カレンダー ／ B＝メニューから入る。どちらがいいか店長が決めるための画面 -->
<style>
  :root{
    --base:#F0FBF4;--card:#FFFFFF;--mint:#A7E8C8;--mint-deep:#5FD0A0;--pink:#FFC9DD;--pink-deep:#FF9EC0;
    --lemon:#FFE9A8;--lavender:#D9C9F5;--sky:#BDE3FF;--text:#4A5560;--text2:#9CAAB5;--rest:#EDEFF2;--line:#E4F4EC;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(circle at 12% 8%,#FFE4F0 0%,transparent 32%),radial-gradient(circle at 88% 14%,#DCF3FF 0%,transparent 30%),linear-gradient(170deg,#F0FBF4,#F6FBFF);
    background-attachment:fixed;color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:60px;}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;max-width:520px;margin:0 auto;}
  .top-name{font-weight:800;font-size:16px;}
  .top-user{font-size:12px;color:var(--text2);}
  .back-app{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;text-decoration:none;color:var(--text);}
  .test-note{background:#FFF8DD;border:1px dashed #F0C850;border-radius:12px;padding:8px 12px;font-size:12px;margin:4px 0 10px;}
  .ab{display:flex;gap:6px;margin-bottom:12px;}
  .ab button{flex:1;border:2px solid var(--lavender);background:#fff;border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;}
  .ab button.on{background:var(--lavender);}
  .seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(95,208,160,.14);margin-bottom:10px;}
  .seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 2px;font-size:14px;font-weight:700;color:var(--text2);}
  .seg button.on{background:var(--pink);color:var(--text);}
  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(95,208,160,.14);margin-bottom:12px;}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 8px;font-weight:800;}
  .month-nav button{border:0;background:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;box-shadow:0 1px 6px rgba(0,0,0,.08);}
  .sum-bar{display:flex;gap:8px;margin-bottom:8px;}
  .sum-bar div{flex:1;background:#fff;border-radius:12px;padding:6px 8px;text-align:center;font-size:11px;color:var(--text2);}
  .sum-bar b{display:block;font-size:16px;color:var(--text);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal .dow{text-align:center;font-size:11px;color:var(--text2);padding:2px 0;}
  .cal .dow.sun{color:#E58;} .cal .dow.sat{color:#58C;}
  .day{background:#fff;border-radius:10px;min-height:62px;padding:3px 3px 4px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .day.blank{background:transparent;}
  .day.today{border-color:var(--mint-deep);}
  .day.sel{border-color:var(--pink-deep);background:#FFF4F8;}
  .day .n{font-size:12px;font-weight:700;}
  .day .chip{font-size:10px;border-radius:6px;padding:0 4px;white-space:nowrap;max-width:100%;overflow:hidden;}
  .chip.shift{background:var(--mint);} .chip.shift.tent{background:var(--lemon);}
  .chip.pay{background:var(--pink);} .chip.pay.wait{background:var(--rest);color:var(--text2);}
  .chip.res{background:var(--sky);} .chip.memo{background:var(--lavender);}
  .hint{font-size:12px;color:var(--text2);text-align:center;margin:8px 0;}
  .detail h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .row:last-child{border-bottom:0;}
  .row.total{font-weight:800;font-size:16px;border-top:2px solid var(--pink);border-bottom:0;margin-top:4px;padding-top:8px;}
  .muted{color:var(--text2);font-size:12px;}
  .badge{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;font-weight:700;}
  .badge.ok{background:var(--mint);} .badge.wait{background:var(--rest);color:var(--text2);}
  .res{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;}
  .res .t{font-weight:800;font-size:15px;}
  .res .kv{font-size:13px;margin-top:4px;}
  .res .kv span{color:var(--text2);display:inline-block;min-width:64px;}
  .memo-box{margin-top:8px;background:#FAF7FF;border-radius:10px;padding:8px;}
  .memo-box textarea{width:100%;min-height:64px;border:1px solid var(--lavender);border-radius:8px;padding:6px;font-family:inherit;font-size:14px;}
  .memo-box .tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;}
  .memo-box .tags button{border:1px solid var(--lavender);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;}
  .memo-box .tags button.on{background:var(--lavender);}
  .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;}
  .btn.pink{background:var(--pink-deep);color:#fff;} .btn.soft{background:#fff;border:1px solid var(--line);}
  .btn.full{width:100%;}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .menu button{background:#fff;border:0;border-radius:18px;padding:18px 8px;box-shadow:0 2px 12px rgba(95,208,160,.14);text-align:center;}
  .menu .ic{font-size:30px;display:block;}
  .menu .lb{font-weight:800;font-size:15px;display:block;margin-top:4px;}
  .menu .sb{font-size:11px;color:var(--text2);display:block;margin-top:2px;}
  .back{border:0;background:none;font-size:14px;font-weight:700;color:var(--pink-deep);margin:2px 0 8px;}
  .list-item{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,.05);border:0;width:100%;text-align:left;}
  .bt-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .bt-pick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;}
  .bt-pick button.on{border-color:var(--pink-deep);background:#FFF0F6;}
  .bt-table{width:100%;border-collapse:collapse;font-size:14px;}
  .bt-table th,.bt-table td{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:right;}
  .bt-table th:first-child,.bt-table td:first-child{text-align:left;}
  .bt-table td.hl{background:#FFF0F6;font-weight:800;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#4A5560;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:.92;}
</style>
</head>
<body>
<div class="top">
  <div><div class="top-name">🌸 サクラシフト <span style="font-size:12px">🧪テスト</span></div><div class="top-user">🍀 <span id="who"></span> さん</div></div>
  <a class="back-app" id="backApp" href="#">‹ いつもの画面</a>
</div>
<div class="wrap">
  <div class="test-note">🧪 <b>テスト画面です（見本のデータ）。</b>本物の予約・精算・お客さんの情報ではありません。メモを書いても、お店には届きません。</div>
  <div class="ab">
    <button id="abA" onclick="setMode('A')">A：切りかえ＋カレンダー</button>
    <button id="abB" onclick="setMode('B')">B：メニューから入る</button>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 見本のデータ（本物ではない）============ */
const Y = 2026, M = 11;   // 2026年11月
const SHIFT = { 2:"18-24", 3:"18-24", 5:"15-23", 7:"18-25", 9:"18-24", 10:"18-24", 12:"15-23", 14:"18-25", 16:"18-24", 17:"18-24", 19:"15-23", 21:"18-25", 23:"18-24", 24:"18-24", 26:"15-23", 28:"18-25", 30:"18-24" };
const TENT = new Set([24, 26, 28, 30]);   // まだ確定していないシフト
const RES = {
  2:[{ t:"19:00-20:30", store:"サクラ池袋", course:"90分", hon:true, name:"たなか", place:"池袋 ホテルA 302", op:"コスプレ", kind:"本指" },
     { t:"21:30-23:30", store:"サクラ池袋", course:"120分", hon:false, name:"すずき", place:"池袋 自宅", op:"", kind:"新" }],
  3:[{ t:"20:00-21:00", store:"Lana(鶯谷)", course:"60分", hon:false, name:"さとう", place:"鶯谷 ホテルB", op:"", kind:"新" }],
  5:[{ t:"16:00-18:00", store:"Lana(鶯谷)", course:"120分", hon:true, name:"たなか", place:"鶯谷 ホテルC", op:"オイル", kind:"本指" },
     { t:"19:00-20:30", store:"極門", course:"90分", hon:false, name:"やまだ", place:"五反田 ホテルD", op:"", kind:"店リ" },
     { t:"21:00-22:00", store:"サクラ池袋", course:"60分", hon:false, name:"いとう", place:"池袋 ホテルA", op:"", kind:"新" }],
  7:[{ t:"22:00-24:30", store:"サクラ池袋", course:"150分", hon:true, name:"わたなべ", place:"池袋 ホテルE", op:"", kind:"本指" }],
  9:[{ t:"19:30-21:00", store:"Lana(鶯谷)", course:"90分", hon:false, name:"なかむら", place:"鶯谷 ホテルB", op:"", kind:"新" }],
  12:[{ t:"16:00-17:30", store:"サクラ池袋", course:"90分", hon:true, name:"たなか", place:"池袋 ホテルA", op:"", kind:"本指" },
      { t:"20:00-22:00", store:"極門", course:"120分", hon:false, name:"こばやし", place:"五反田 ホテルD", op:"", kind:"新" }],
  14:[{ t:"21:00-22:30", store:"サクラ池袋", course:"90分", hon:false, name:"かとう", place:"池袋 自宅", op:"", kind:"店リ" }],
  16:[{ t:"19:00-21:00", store:"Lana(鶯谷)", course:"120分", hon:true, name:"すずき", place:"鶯谷 ホテルC", op:"", kind:"本指" }],
  17:[{ t:"20:00-21:30", store:"サクラ池袋", course:"90分", hon:false, name:"よしだ", place:"池袋 ホテルA", op:"", kind:"新" }],
  19:[{ t:"17:00-18:00", store:"サクラ池袋", course:"60分", hon:false, name:"やまもと", place:"池袋 ホテルE", op:"", kind:"新" },
      { t:"19:30-21:30", store:"Lana(鶯谷)", course:"120分", hon:true, name:"たなか", place:"鶯谷 ホテルB", op:"コスプレ", kind:"本指" }],
  21:[{ t:"22:00-23:30", store:"サクラ池袋", course:"90分", hon:false, name:"まつもと", place:"池袋 ホテルA", op:"", kind:"店リ" }],
  23:[{ t:"19:00-20:30", store:"サクラ池袋", course:"90分", hon:true, name:"わたなべ", place:"池袋 ホテルE", op:"", kind:"本指" }],
  24:[{ t:"20:00-22:00", store:"Lana(鶯谷)", course:"120分", hon:false, name:"いのうえ", place:"鶯谷 ホテルC", op:"", kind:"新" }],
};
// バック表（見本）：店 → コース → [ふつう, 本指名]
const BACK = {
  "サクラ池袋": { "60分":[11000,12000], "90分":[13500,15000], "120分":[18000,20000], "150分":[22500,25000] },
  "Lana(鶯谷)": { "60分":[10500,11500], "90分":[13000,14500], "120分":[17500,19500], "150分":[22000,24500] },
  "極門":       { "60分":[12000,13000], "90分":[15000,16500], "120分":[20000,22000] },
};
const OP_BACK = { "コスプレ":1000, "オイル":1000 };
const TRANSPORT = 1000, ZAPPI = 1000;
const today = 23;
// 精算：その日の予約のバックから作る（見本）。今日より前は「確定ずみ」、今日から先は「まだ」
function settleOf(d){
  const rs = RES[d]; if(!rs) return null;
  const lines = rs.map(r => { const b = BACK[r.store][r.course][r.hon ? 1 : 0]; return { label:`${r.t.split("-")[0]} ${r.store} ${r.course}${r.hon ? "（本指名）" : ""}`, back:b, op: r.op ? (OP_BACK[r.op] || 0) : 0, opName:r.op }; });
  const back = lines.reduce((s, x) => s + x.back + x.op, 0);
  const total = back + TRANSPORT - ZAPPI;
  return { lines, back, total, done: d < today };
}
const memos = {};   // テストなので画面の中だけ（お店には届かない）
try{ Object.assign(memos, JSON.parse(localStorage.getItem("kbCastTestMemo") || "{}")); }catch(e){}

/* ============ 共通 ============ */
const $ = id => document.getElementById(id);
const yen = n => "¥" + Number(n).toLocaleString("ja-JP");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dowOf = d => new Date(Y, M - 1, d).getDay();
const DOW = ["日","月","火","水","木","金","土"];
const daysIn = new Date(Y, M, 0).getDate();
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }
// ログインしていないとき（キャストの名前がこのタブにない）は、ログイン画面へ
const NAME = sessionStorage.getItem("castName") || "";
if(!NAME) location.replace("index.html");
$("who").textContent = NAME;
$("backApp").href = "cast_live.html?name=" + encodeURIComponent(NAME);

let mode = "A", seg = "shift", sel = today, page = "home", btStore = "サクラ池袋", btHon = false;
try{ mode = localStorage.getItem("kbCastTestMode") || "A"; }catch(e){}
function setMode(m){ mode = m; page = "home"; try{ localStorage.setItem("kbCastTestMode", m); }catch(e){} render(); }

// カレンダー（kind：shift / pay / res）
function calHtml(kind, onTap){
  let h = DOW.map((w, i) => `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`).join("");
  for(let i = 0; i < dowOf(1); i++) h += `<div class="day blank"></div>`;
  for(let d = 1; d <= daysIn; d++){
    let chips = "";
    if(kind === "shift" && SHIFT[d]) chips = `<span class="chip shift ${TENT.has(d) ? "tent" : ""}">${SHIFT[d]}</span>`;
    if(kind === "pay"){ const s = settleOf(d); if(s) chips = s.done ? `<span class="chip pay">${(s.total / 1000).toFixed(1)}千</span>` : `<span class="chip pay wait">まだ</span>`; }
    if(kind === "res" && RES[d]){ chips = `<span class="chip res">${RES[d].length}件</span>`; if(RES[d].some((r, i) => memos[d + "-" + i])) chips += `<span class="chip memo">📝</span>`; }
    if(kind === "all"){
      if(SHIFT[d]) chips += `<span class="chip shift ${TENT.has(d) ? "tent" : ""}">${SHIFT[d]}</span>`;
      if(RES[d]) chips += `<span class="chip res">${RES[d].length}件</span>`;
    }
    h += `<button class="day ${d === today ? "today" : ""} ${d === sel ? "sel" : ""}" onclick="${onTap}(${d})"><span class="n">${d}</span>${chips}</button>`;
  }
  return `<div class="month-nav"><button onclick="toast('テストなので11月だけです')">‹</button>${Y}年 ${M}月<button onclick="toast('テストなので11月だけです')">›</button></div><div class="card" style="padding:8px"><div class="cal">${h}</div></div>`;
}
function monthSum(){
  let done = 0, wait = 0, cnt = 0, days = 0;
  for(let d = 1; d <= daysIn; d++){ const s = settleOf(d); if(s){ if(s.done) done += s.total; else wait++; } if(RES[d]) cnt += RES[d].length; if(SHIFT[d]) days++; }
  return { done, wait, cnt, days };
}
// その日の中身
function shiftDetail(d){
  const s = SHIFT[d];
  return `<div class="card detail"><h3>📅 ${M}/${d}（${DOW[dowOf(d)]}）のシフト</h3>${s ? `<div class="row"><span>時間</span><b>${s}</b></div><div class="row"><span>状態</span>${TENT.has(d) ? `<span class="badge wait">提出済み（未確定）</span>` : `<span class="badge ok">確定</span>`}</div>` : `<div class="muted">この日はシフトがありません</div>`}
    <div class="muted" style="margin-top:8px">※ シフトの入力・変更は「いつもの画面」でします</div></div>`;
}
function payDetail(d){
  const s = settleOf(d);
  if(!s) return `<div class="card detail"><h3>💴 ${M}/${d}（${DOW[dowOf(d)]}）の精算</h3><div class="muted">この日の精算はありません</div></div>`;
  if(!s.done) return `<div class="card detail"><h3>💴 ${M}/${d}（${DOW[dowOf(d)]}）の精算 <span class="badge wait">まだ</span></h3><div class="muted">お店が精算を確定すると、ここに明細が出ます</div></div>`;
  return `<div class="card detail"><h3>💴 ${M}/${d}（${DOW[dowOf(d)]}）の精算明細 <span class="badge ok">確定</span></h3>
    ${s.lines.map(x => `<div class="row"><span>${esc(x.label)}</span><span>${yen(x.back)}</span></div>${x.op ? `<div class="row"><span>　オプション（${esc(x.opName)}）</span><span>${yen(x.op)}</span></div>` : ""}`).join("")}
    <div class="row"><span>交通費</span><span>${yen(TRANSPORT)}</span></div>
    <div class="row"><span>雑費</span><span>−${yen(ZAPPI)}</span></div>
    <div class="row total"><span>受け取り</span><span>${yen(s.total)}</span></div>
    <div class="muted" style="margin-top:6px">確定：${M}/${d + 1} 6:10（内勤）</div></div>`;
}
function resDetail(d){
  const rs = RES[d];
  if(!rs) return `<div class="card detail"><h3>📖 ${M}/${d}（${DOW[dowOf(d)]}）の予約</h3><div class="muted">この日の予約はありません</div></div>`;
  return `<div class="card detail"><h3>📖 ${M}/${d}（${DOW[dowOf(d)]}）の予約 ${rs.length}件</h3>${rs.map((r, i) => resCard(d, i, r)).join("")}</div>`;
}
const TAGS = ["また来たい", "やさしい", "NGにしたい", "時間にルーズ", "要注意"];
function resCard(d, i, r){
  const k = d + "-" + i, m = memos[k] || { text:"", tags:[] };
  return `<div class="res"><div class="t">${r.t}　${esc(r.course)}${r.hon ? "　💗本指名" : ""}</div>
    <div class="kv"><span>お店</span>${esc(r.store)}</div>
    <div class="kv"><span>お客さん</span>${esc(r.name)} さま（${esc(r.kind)}）</div>
    <div class="kv"><span>場所</span>${esc(r.place)}</div>
    ${r.op ? `<div class="kv"><span>オプション</span>${esc(r.op)}</div>` : ""}
    <div class="memo-box"><div style="font-size:13px;font-weight:700">📝 お客さんメモ（お店にも届きます）</div>
      <div class="tags">${TAGS.map(t => `<button class="${m.tags.includes(t) ? "on" : ""}" onclick="tagMemo('${k}','${t}')">${t}</button>`).join("")}</div>
      <textarea id="memo-${k}" placeholder="例：タバコNG・次は90分希望 など">${esc(m.text)}</textarea>
      <button class="btn pink full" style="margin-top:6px" onclick="saveMemo('${k}')">保存してお店に送る</button></div></div>`;
}
function tagMemo(k, t){ const m = memos[k] || (memos[k] = { text:"", tags:[] }); const ta = $("memo-" + k); if(ta) m.text = ta.value; m.tags = m.tags.includes(t) ? m.tags.filter(x => x !== t) : m.tags.concat(t); render(); }
function saveMemo(k){ const m = memos[k] || (memos[k] = { text:"", tags:[] }); m.text = $("memo-" + k).value; try{ localStorage.setItem("kbCastTestMemo", JSON.stringify(memos)); }catch(e){} toast("🧪 テストなので、お店には届きません（本番は届きます）"); render(); }
// バック表
function backTable(){
  const stores = Object.keys(BACK), cs = BACK[btStore];
  return `<div class="card"><h3 style="font-size:15px;margin-bottom:8px">💗 わたしのバック表</h3>
    <div class="muted" style="margin-bottom:6px">お店</div>
    <div class="bt-pick">${stores.map(s => `<button class="${s === btStore ? "on" : ""}" onclick="btStore='${s}';render()">${esc(s)}</button>`).join("")}</div>
    <div class="muted" style="margin-bottom:6px">指名</div>
    <div class="bt-pick"><button class="${!btHon ? "on" : ""}" onclick="btHon=false;render()">本指名じゃない</button><button class="${btHon ? "on" : ""}" onclick="btHon=true;render()">💗 本指名</button></div>
    <table class="bt-table"><tr><th>コース</th><th>バック</th></tr>
      ${Object.keys(cs).map(c => `<tr><td>${c}</td><td class="hl">${yen(cs[c][btHon ? 1 : 0])}</td></tr>`).join("")}</table>
    <div class="muted" style="margin-top:8px">オプションのバック：${Object.keys(OP_BACK).map(o => o + " " + yen(OP_BACK[o])).join("・")}</div></div>`;
}

/* ============ A：切りかえ＋カレンダー ============ */
function tapA(d){ sel = d; render(); setTimeout(() => { const el = $("detail"); if(el) el.scrollIntoView({ behavior:"smooth", block:"start" }); }, 30); }
function renderA(){
  const s = monthSum();
  const segs = [["shift", "📅 シフト"], ["pay", "💴 報酬"], ["res", "📖 予約"]];
  let top = `<div class="seg">${segs.map(([k, l]) => `<button class="${seg === k ? "on" : ""}" onclick="seg='${k}';render()">${l}</button>`).join("")}</div>`;
  let sum = seg === "shift" ? `<div class="sum-bar"><div>今月の出勤<b>${s.days}日</b></div><div>未確定<b>${TENT.size}日</b></div></div>`
          : seg === "pay" ? `<div class="sum-bar"><div>今月の受け取り（確定分）<b>${yen(s.done)}</b></div><div>まだの日<b>${s.wait}日</b></div></div>`
          : `<div class="sum-bar"><div>今月の予約<b>${s.cnt}件</b></div><div>メモを書いた<b>${Object.keys(memos).length}件</b></div></div>`;
  let detail = seg === "shift" ? shiftDetail(sel) : seg === "pay" ? payDetail(sel) : resDetail(sel);
  let extra = seg === "pay" ? `<button class="btn soft full" style="margin-bottom:12px" onclick="seg='back';render()">💗 わたしのバック表を見る</button>` : "";
  if(seg === "back") return top + `<button class="back" onclick="seg='pay';render()">‹ 報酬にもどる</button>` + backTable();
  return top + sum + calHtml(seg, "tapA") + `<div class="hint">日付をタップすると、下に出ます</div><div id="detail">${detail}</div>` + extra;
}

/* ============ B：メニューから入る ============ */
function go(p){ page = p; if(p === "res" || p === "pay") sel = sel || today; render(); window.scrollTo(0, 0); }
function renderB(){
  const s = monthSum(), back = `<button class="back" onclick="go('home')">‹ メニュー</button>`;
  if(page === "home"){
    const nx = Object.keys(RES).map(Number).filter(d => d >= today).sort((a, b) => a - b)[0];
    return `<div class="menu">
      <button onclick="go('shift')"><span class="ic">📅</span><span class="lb">シフト</span><span class="sb">今月 ${s.days}日</span></button>
      <button onclick="go('pay')"><span class="ic">💴</span><span class="lb">報酬・精算</span><span class="sb">確定分 ${yen(s.done)}</span></button>
      <button onclick="go('res')"><span class="ic">📖</span><span class="lb">予約・お客さん</span><span class="sb">今月 ${s.cnt}件</span></button>
      <button onclick="go('back')"><span class="ic">💗</span><span class="lb">バック表</span><span class="sb">お店×コース</span></button>
    </div>
    ${nx ? `<div class="card" style="margin-top:12px"><div class="muted">次の予約</div><div style="font-weight:800">${M}/${nx}（${DOW[dowOf(nx)]}） ${RES[nx][0].t} ${esc(RES[nx][0].store)} ${RES[nx][0].course}</div></div>` : ""}`;
  }
  if(page === "shift") return back + calHtml("shift", "tapB") + `<div id="detail">${shiftDetail(sel)}</div>`;
  if(page === "back") return back + backTable();
  if(page === "pay"){
    let list = "";
    for(let d = daysIn; d >= 1; d--){ const x = settleOf(d); if(!x) continue;
      list += `<button class="list-item" onclick="sel=${d};page='payDay';render();window.scrollTo(0,0)"><span>${M}/${d}（${DOW[dowOf(d)]}）　${RES[d].length}件</span>${x.done ? `<b>${yen(x.total)}</b>` : `<span class="badge wait">まだ</span>`}</button>`; }
    return back + `<div class="sum-bar"><div>今月の受け取り（確定分）<b>${yen(s.done)}</b></div><div>まだの日<b>${s.wait}日</b></div></div>` + list;
  }
  if(page === "payDay") return `<button class="back" onclick="go('pay')">‹ 報酬・精算</button>` + payDetail(sel);
  if(page === "res"){
    let list = "";
    Object.keys(RES).map(Number).sort((a, b) => a - b).forEach(d => RES[d].forEach((r, i) => {
      list += `<button class="list-item" onclick="sel=${d};page='resDay';render();window.scrollTo(0,0)"><span><b>${M}/${d}（${DOW[dowOf(d)]}）</b> ${r.t.split("-")[0]} ${esc(r.store)} ${r.course}${r.hon ? " 💗" : ""}</span><span>${memos[d + "-" + i] ? "📝" : "›"}</span></button>`;
    }));
    return back + `<div class="sum-bar"><div>今月の予約<b>${s.cnt}件</b></div><div>メモを書いた<b>${Object.keys(memos).length}件</b></div></div>` + list;
  }
  if(page === "resDay") return `<button class="back" onclick="go('res')">‹ 予約・お客さん</button>` + resDetail(sel);
  return "";
}
function tapB(d){ sel = d; render(); }

function render(){
  $("abA").classList.toggle("on", mode === "A"); $("abB").classList.toggle("on", mode === "B");
  $("view").innerHTML = mode === "A" ? renderA() : renderB();
}
render();
</script>
</body>
</html>
