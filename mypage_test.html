<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>サクラシフト（新しい画面）</title>
<link rel="icon" href="favicon.png">
<meta name="theme-color" content="#FF9EC0">
<!-- 📱 キャストの新しい画面（2026/11/23・はじめはテストのキャスト〈ムム〉だけ）
     上の「シフト・報酬・予約」を切りかえて、カレンダーの日付をタップ（店長が A の形に決めた）
     本物のデータは Supabase の窓口（SQL 955）から。窓口は「ログインしているキャスト本人」の分だけ返す。
     お客さんの電話番号・内勤の顧客台帳・ほかのキャストの情報は、窓口が返さないので、この画面にも来ない -->
<style>
  :root{
    --base:#F0FBF4;--card:#FFFFFF;--mint:#A7E8C8;--mint-deep:#5FD0A0;--pink:#FFC9DD;--pink-deep:#FF9EC0;
    --lemon:#FFE9A8;--lavender:#D9C9F5;--sky:#BDE3FF;--text:#4A5560;--text2:#9CAAB5;--rest:#EDEFF2;--line:#E4F4EC;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(circle at 12% 8%,#FFE4F0 0%,transparent 32%),radial-gradient(circle at 88% 14%,#DCF3FF 0%,transparent 30%),linear-gradient(170deg,#F0FBF4,#F6FBFF);
    background-attachment:fixed;color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:60px;}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;max-width:520px;margin:0 auto;}
  .top-name{font-weight:800;font-size:16px;}
  .top-user{font-size:12px;color:var(--text2);}
  .back-app{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;text-decoration:none;color:var(--text);}
  .test-note{background:#FFF8DD;border:1px dashed #F0C850;border-radius:12px;padding:8px 12px;font-size:12px;margin:4px 0 10px;}
  .seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(95,208,160,.14);margin-bottom:10px;}
  .seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 2px;font-size:14px;font-weight:700;color:var(--text2);}
  .seg button.on{background:var(--pink);color:var(--text);}
  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(95,208,160,.14);margin-bottom:12px;}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 8px;font-weight:800;}
  .month-nav button{border:0;background:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;box-shadow:0 1px 6px rgba(0,0,0,.08);}
  .sum-bar{display:flex;gap:8px;margin-bottom:8px;}
  .sum-bar div{flex:1;background:#fff;border-radius:12px;padding:6px 8px;text-align:center;font-size:11px;color:var(--text2);}
  .sum-bar b{display:block;font-size:16px;color:var(--text);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal .dow{text-align:center;font-size:11px;color:var(--text2);padding:2px 0;}
  .cal .dow.sun{color:#E58;} .cal .dow.sat{color:#58C;}
  .day{background:#fff;border-radius:10px;min-height:58px;padding:3px 2px 4px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .day.blank{background:transparent;}
  .day.today{border-color:var(--mint-deep);}
  .day.sel{border-color:var(--pink-deep);background:#FFF4F8;}
  .day .n{font-size:12px;font-weight:700;}
  .day .chip{font-size:10px;border-radius:6px;padding:0 3px;white-space:nowrap;max-width:100%;overflow:hidden;}
  .chip.shift{background:var(--mint);} .chip.shift.tent{background:var(--lemon);}
  .chip.pay{background:var(--pink);} .chip.pay.wait{background:var(--rest);color:var(--text2);}
  .chip.res{background:var(--sky);} .chip.memo{background:var(--lavender);}
  .hint{font-size:12px;color:var(--text2);text-align:center;margin:8px 0;}
  .detail h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:8px;}
  .row:last-child{border-bottom:0;}
  .line{font-size:14px;padding:2px 0;white-space:pre-wrap;}
  .line.big{font-weight:800;font-size:16px;}
  .muted{color:var(--text2);font-size:12px;}
  .badge{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;font-weight:700;}
  .badge.ok{background:var(--mint);} .badge.wait{background:var(--rest);color:var(--text2);} .badge.off{background:#FFE0E0;color:#B24;}
  .res{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;}
  .res.off{opacity:.55;}
  .res .t{font-weight:800;font-size:15px;}
  .res .kv{font-size:13px;margin-top:4px;display:flex;gap:6px;}
  .res .kv span:first-child{color:var(--text2);flex:0 0 72px;}
  .wish{display:inline-block;font-weight:800;font-size:13px;border-radius:8px;padding:1px 8px;margin-right:4px;}
  .wish.yes{background:#FFE0EC;color:#C2185B;} .wish.no{background:var(--rest);color:var(--text2);}
  .memo-box{margin-top:8px;background:#FAF7FF;border-radius:10px;padding:8px;}
  .memo-box textarea{width:100%;min-height:64px;border:1px solid var(--lavender);border-radius:8px;padding:6px;font-family:inherit;font-size:14px;}
  .memo-box .tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;}
  .memo-box .tags button{border:1px solid var(--lavender);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;}
  .memo-box .tags button.on{background:var(--lavender);}
  .hist{margin-top:8px;background:#F3FAFF;border-radius:10px;padding:8px;font-size:13px;}
  .hist .h{padding:3px 0;border-bottom:1px dashed #D6EAF8;}
  .hist .h:last-child{border-bottom:0;}
  .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;}
  .btn.pink{background:var(--pink-deep);color:#fff;} .btn.soft{background:#fff;border:1px solid var(--line);} .btn.sky{background:var(--sky);}
  .btn.full{width:100%;}
  .btn:disabled{opacity:.5;}
  .back{border:0;background:none;font-size:14px;font-weight:700;color:var(--pink-deep);margin:2px 0 8px;}
  .bt-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .bt-pick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;}
  .bt-pick button.on{border-color:var(--pink-deep);background:#FFF0F6;}
  .bt-row{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:14px;}
  .bt-note{padding:6px 2px;font-size:13px;color:#8A5A00;background:#FFF9E8;border-radius:8px;margin:4px 0;}
  .rule{background:#FFF8DD;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:13px;}
  .err{background:#FFE9E9;border-radius:12px;padding:10px 12px;font-size:13px;color:#A33;margin-bottom:10px;}
  /* 📝 メモ・⚙ 項目：画面いっぱい（スマホで書きやすく。文字は16px＝iPhoneで拡大されない） */
  .sheet{position:fixed;inset:0;background:#fff;z-index:10;display:flex;flex-direction:column;}
  .sh-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FFF4F8;}
  .sh-x{border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;box-shadow:0 1px 6px rgba(0,0,0,.1);flex:0 0 36px;}
  .sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 24px;max-width:560px;width:100%;margin:0 auto;}
  .sh-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;max-width:560px;width:100%;margin:0 auto;}
  .sh-foot .btn{padding:14px;font-size:16px;}
  .f-l{display:block;font-weight:800;font-size:14px;margin:14px 0 4px;}
  .f-in{width:100%;font-size:16px;font-family:inherit;border:1.5px solid var(--lavender);border-radius:10px;padding:10px;resize:none;line-height:1.5;background:#fff;color:var(--text);}
  textarea.f-in{overflow:hidden;min-height:44px;}
  .f-in:focus{outline:none;border-color:var(--pink-deep);}
  .f-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .f-chips button{border:1.5px solid var(--lavender);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;}
  .f-chips button.on{background:var(--lavender);}
  .f-prev{background:#F3FAFF;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:4px;}
  .f-prev b{color:#2a7ab8;}
  .tpl-btn{display:block;width:100%;margin-top:22px;border:2px dashed #9C6ADE;background:#F3ECFF;color:#5E35B1;border-radius:14px;padding:14px;font-size:16px;font-weight:800;}
  .shopnote{background:#FFEBEE;color:#C62828;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;margin-top:4px;white-space:pre-wrap;}
  .tp-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;}
  .tp-b{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:40px;height:40px;font-size:16px;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#4A5560;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;}
  .toast.show{opacity:.92;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.SHIFT_DB_ROLE='cast';</script>
<script src="shift_db.js"></script>
</head>
<body>
<div class="top">
  <div><div class="top-name">🌸 サクラシフト <span style="font-size:12px">🧪テスト中</span></div><div class="top-user">🍀 <span id="who"></span> さん</div></div>
  <a class="back-app" id="backApp" href="cast_live.html">‹ いつもの画面</a>
</div>
<div class="wrap">
  <div class="test-note">🧪 <b>テスト中の新しい画面です。</b>見えるのは、あなたの予約・精算・メモだけです（ほかの人には見えません）。メモはお店にも届きます。</div>
  <div id="view"><div class="hint">読みこみ中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const yen = n => "¥" + Math.round(Number(n) || 0).toLocaleString("ja-JP");
const DOW = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2, "0");
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
const sb = ShiftDB.client;

// 今日の営業日（朝6時で切りかえ・日本時間）
const nowJ = new Date(Date.now() + 9 * 3600e3 - 6 * 3600e3);
const TODAY = ymd(nowJ.getUTCFullYear(), nowJ.getUTCMonth() + 1, nowJ.getUTCDate());
let Y = nowJ.getUTCFullYear(), M = nowJ.getUTCMonth() + 1;
let seg = "res", sel = TODAY, NAME = "";
const D = { res: [], settles: {}, memos: {}, weeks: {}, back: null, hist: {}, histOpen: {} };
try{ seg = localStorage.getItem("kbCastSeg") || "res"; }catch(e){}

const daysIn = (y, m) => new Date(y, m, 0).getDate();
const dowOf = s => new Date(s + "T12:00:00Z").getUTCDay();
const md = s => { const [, m, d] = s.split("-").map(Number); return `${m}/${d}（${DOW[dowOf(s)]}）`; };
function hmJ(iso){ if(!iso) return "--:--"; const d = new Date(new Date(iso).getTime() + 9 * 3600e3); let h = d.getUTCHours(); if(h < 6) h += 24; return h + ":" + pad(d.getUTCMinutes()); }   // 深夜は 26:00 のように
const hrs = v => { const n = Number(v); if(!isFinite(n)) return String(v || ""); const h = Math.floor(n), mm = Math.round((n - h) * 60); return h + (mm ? ":" + pad(mm) : ""); };
function weekKey(s){ const d = new Date(s + "T12:00:00Z"), w = d.getUTCDay(); d.setUTCDate(d.getUTCDate() + (w === 0 ? -6 : 1 - w)); return d.toISOString().slice(0, 10); }
function weeksOfMonth(y, m){ const s = new Set(); for(let d = 1; d <= daysIn(y, m); d++) s.add(weekKey(ymd(y, m, d))); return [...s]; }

/* ---------- 読みこみ ---------- */
async function boot(){
  const s = await ShiftDB.getSession();
  if(!s){ location.replace("index.html"); return; }
  NAME = ShiftDB.sessionCast(s);
  $("who").textContent = NAME;
  $("backApp").href = "cast_live.html?name=" + encodeURIComponent(NAME);
  await loadMonth();
}
async function loadMonth(){
  $("view").innerHTML = `<div class="hint">読みこみ中…</div>`;
  const from = ymd(Y, M, 1), to = ymd(Y, M, daysIn(Y, M));
  try{
    const [home, wk] = await Promise.all([
      sb.rpc("cast_app_home", { p_from: from, p_to: to }),
      ShiftDB.call({ action: "loadMonth", cast: NAME, weeks: weeksOfMonth(Y, M) }),
    ]);
    if(home.error) throw home.error;
    const h = home.data || {};
    if(h.error === "not_allowed"){ $("view").innerHTML = `<div class="err">この画面は、まだ使えません（テスト中のキャストだけ）。「いつもの画面」にもどってください。</div>`; return; }
    if(h.error) throw new Error(h.error);
    D.res = h.reservations || [];
    D.settles = {}; (h.settles || []).forEach(x => { D.settles[x.biz_date] = x; });
    D.memos = h.memos || {};
    D.weeks = (wk && wk.weeks) || {};
  }catch(e){ $("view").innerHTML = `<div class="err">読みこめませんでした：${esc(e.message || e)}<br>電波のよいところで、もう一度開いてください。</div>`; return; }
  render();
}
function shiftOf(s){
  const w = D.weeks[weekKey(s)]; if(!w || !w.shifts || !w.shifts[s]) return null;
  const x = w.shifts[s], st = w.status || "unsubmitted";
  return { start: x.start, end: x.end, status: st, ok: st === "confirmed" || st === "change_confirmed" };
}
const resOf = s => D.res.filter(r => r.biz_date === s);
const OFF = { cancel: "キャンセル", tobi: "トビ", flowed: "流れた" };
const APP_START = "2026-11-23";   // アプリに精算が届くようになった日。それより前は LINE で送っていたので「まだ」にしない

/* ---------- カレンダー ---------- */
function calHtml(){
  let h = DOW.map((w, i) => `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`).join("");
  for(let i = 0; i < dowOf(ymd(Y, M, 1)); i++) h += `<div class="day blank"></div>`;
  for(let d = 1; d <= daysIn(Y, M); d++){
    const s = ymd(Y, M, d); let chips = "";
    if(seg === "shift"){ const x = shiftOf(s); if(x) chips = `<span class="chip shift ${x.ok ? "" : "tent"}">${hrs(x.start)}-${hrs(x.end)}</span>`; }
    if(seg === "pay"){ const st = D.settles[s]; if(st) chips = `<span class="chip pay">${(st.take_home / 1000).toFixed(1)}千</span>`; else if(s >= APP_START && resOf(s).some(r => !OFF[r.status])) chips = `<span class="chip pay wait">まだ</span>`; }
    if(seg === "res"){ const rs = resOf(s).filter(r => !OFF[r.status]); if(rs.length) chips = `<span class="chip res">${rs.length}件</span>`; if(resOf(s).some(r => D.memos[r.id])) chips += `<span class="chip memo">📝</span>`; }
    h += `<button class="day ${s === TODAY ? "today" : ""} ${s === sel ? "sel" : ""}" onclick="tap('${s}')"><span class="n">${d}</span>${chips}</button>`;
  }
  return `<div class="month-nav"><button onclick="mv(-1)">‹</button>${Y}年 ${M}月<button onclick="mv(1)">›</button></div><div class="card" style="padding:8px"><div class="cal">${h}</div></div>`;
}
function mv(k){ M += k; if(M < 1){ M = 12; Y--; } if(M > 12){ M = 1; Y++; } sel = ymd(Y, M, 1); if(sel.slice(0, 7) === TODAY.slice(0, 7)) sel = TODAY; loadMonth(); }
function tap(s){ sel = s; render(); setTimeout(() => { const el = $("detail"); if(el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30); }
function setSeg(k){ seg = k; try{ localStorage.setItem("kbCastSeg", k); }catch(e){} render(); }

/* ---------- その日の中身 ---------- */
function shiftDetail(s){
  const x = shiftOf(s);
  return `<div class="card detail"><h3>📅 ${md(s)}のシフト</h3>${x ? `<div class="row"><span>時間</span><b>${hrs(x.start)}〜${hrs(x.end)}</b></div><div class="row"><span>状態</span>${x.ok ? `<span class="badge ok">確定</span>` : `<span class="badge wait">まだ確定していません</span>`}</div>` : `<div class="muted">この日はシフトがありません</div>`}
    <div class="muted" style="margin-top:8px">※ シフトの入力・変更は「いつもの画面」でします</div></div>`;
}
function payDetail(s){
  const st = D.settles[s];
  if(!st){
    const has = resOf(s).some(r => !OFF[r.status]);
    if(has && s < APP_START) return `<div class="card detail"><h3>💴 ${md(s)}の精算</h3><div class="muted">この日の精算は、アプリが始まる前なので LINE で送っています（LINE を見てください）</div></div>`;
    return `<div class="card detail"><h3>💴 ${md(s)}の精算 ${has ? `<span class="badge wait">まだ</span>` : ""}</h3><div class="muted">${has ? "お店が精算を確定すると、ここに明細が出ます" : "この日の精算はありません"}</div></div>`;
  }
  const lines = (st.lines || []).map(l => { const big = /^本日のお給料|^投函額/.test(l); return l === "" ? `<div style="height:6px"></div>` : `<div class="line ${big ? "big" : ""}">${esc(l)}</div>`; }).join("");
  const at = new Date(new Date(st.shared_at).getTime() + 9 * 3600e3);
  return `<div class="card detail"><h3>💴 ${md(s)}の精算明細 <span class="badge ok">確定</span></h3>${lines}
    <div class="muted" style="margin-top:6px">確定：${at.getUTCMonth() + 1}/${at.getUTCDate()} ${at.getUTCHours()}:${pad(at.getUTCMinutes())}</div></div>`;
}
const TAGS = ["NG", "要注意"];   // お店に伝えたいこと（選んだら中身を必ず書く。2026/11/23 店長）
const FREE = { free: "フリー", special_free: "特別フリー", event_free: "イベフリー" };
const VISIT = { new: "新規", repeat: "店リピ", honshi: "💗本指名" };
const PAY = { cash: "現金", card: "カード", card_paid: "カード（決済ずみ）" };
function wishHtml(r){
  const w = (v, l) => v === "yes" ? `<span class="wish yes">${l} 希望</span>` : v === "no" ? `<span class="wish no">${l} なし</span>` : "";
  return w(r.af, "AF") + w(r.raf, "逆AF");
}
function resCard(r){
  const off = OFF[r.status], k = String(r.id), m = D.memos[k] || { tags: [], body: "" };
  const course = `${esc(r.course)}${/^\d+$/.test(r.course) ? "分" : ""}${FREE[r.free] ? "（" + FREE[r.free] + "）" : ""}${r.ext ? "＋延長" + r.ext * 30 + "分" : ""}${r.date ? "＋デート" + r.date * 30 + "分" : ""}`;
  const opTxt = o => esc(String(o.label || "").replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, "").trim()) + (o.qty > 1 ? "×" + o.qty : "") + (o.memo ? "（" + esc(o.memo) + "）" : "");
  const bk = (r.options || []).filter(o => o.back).map(opTxt).join("・"), nb = (r.options || []).filter(o => !o.back).map(opTxt).join("・");
  const wish = wishHtml(r);
  const hOpen = D.histOpen[k], H = D.hist[k];
  return `<div class="res ${off ? "off" : ""}"><div class="t">${hmJ(r.start_at)}〜${hmJ(r.end_at)}　${course} ${off ? `<span class="badge off">${off}</span>` : ""}</div>
    <div class="kv"><span>お店</span><span>${esc(r.store)}${r.dummy_name ? "（「" + esc(r.dummy_name) + "」で受けています）" : ""}</span></div>
    <div class="kv"><span>お客さん</span><span>${esc(r.name || "お客")} さま　${VISIT[r.visit] || ""}</span></div>
    <div class="kv"><span>場所</span><span>${esc([r.area, r.address].filter(Boolean).join(" "))}</span></div>
    ${wish || r.play ? `<div class="kv"><span>希望プレイ</span><span>${wish}${r.play ? `<div>${esc(r.play)}</div>` : ""}</span></div>` : ""}
    <div class="kv"><span>バック有OP</span><span>${bk || "なし"}</span></div>
    <div class="kv"><span>バック無OP</span><span>${nb || "なし"}</span></div>
    ${r.cast_note ? `<div class="kv"><span>特記事項</span><span style="white-space:pre-wrap">${esc(r.cast_note)}</span></div>` : ""}
    <div class="kv"><span>お支払い</span><span>${r.payment === "cash" ? "料金総額 " + yen(r.total) + "（最初にいただく）" : PAY[r.payment] || ""}</span></div>
    ${r.history ? `<button class="btn sky full" style="margin-top:8px" onclick="toggleHist('${k}')">${hOpen ? "▲ とじる" : "📖 このお客さんとの前の利用・メモを見る"}</button>
      ${hOpen ? `<div class="hist">${!H ? "読みこみ中…" : histHtml(H)}</div>` : ""}` : ""}
    ${off ? "" : `<div class="memo-box"><div style="font-size:13px;font-weight:700">📝 お客さんメモ <span class="muted">（お店にも届きます・ほかのキャストには見えません）</span></div>
      ${m.at ? memoView(m) : `<div class="muted" style="margin:4px 0">まだ書いていません</div>`}
      <button class="btn pink full" style="margin-top:6px" onclick="openMemo('${k}')">${m.at ? "✏️ メモを直す" : "📝 メモを書く"}</button></div>`}
  </div>`;
}
// 書いたメモの見え方（LINE で送っていた形：「あだ名」・項目▶️中身）
function memoView(m){
  const f = (m.fields || []).filter(x => String(x.value || "").trim());
  return `<div style="font-size:13px;white-space:pre-wrap;margin:4px 0">${m.nick ? `<b>「${esc(m.nick)}」</b>\n` : ""}${f.map(x => `${esc(x.label)}▶️${esc(x.value)}`).join("\n")}${m.body ? (f.length ? "\n" : "") + esc(m.body) : ""}</div>
    ${(m.tags || []).length ? `<div class="shopnote">⚠ ${m.tags.map(esc).join("・")}${m.shop_note ? "：" + esc(m.shop_note) : ""}</div>` : ""}`;
}
function histHtml(H){
  if(H.error) return `<span class="muted">読めませんでした</span>`;
  const v = (H.visits || []).map(x => `<div class="h"><b>${esc(md(x.biz_date))}</b> ${esc(x.store || "")} ${esc(x.course || "")}${/^\d+$/.test(x.course || "") ? "分" : ""}${x.ext ? " 延長" + x.ext : ""}${x.options ? "・" + esc(x.options) : ""} ${OFF[x.status] ? `<span class="badge off">${OFF[x.status]}</span>` : ""}</div>`).join("");
  const m = (H.memos || []).map(x => `<div class="h">📝 <b>${esc(md(x.biz_date))}</b>${memoView(x)}</div>`).join("");
  return `<div style="font-weight:700;margin-bottom:2px">あなたについた前の利用（${(H.visits || []).length}回）</div>${v || '<div class="muted">ありません</div>'}
    <div style="font-weight:700;margin:6px 0 2px">あなたが書いたメモ</div>${m || '<div class="muted">ありません</div>'}`;
}
async function toggleHist(k){
  D.histOpen[k] = !D.histOpen[k]; render();
  if(D.histOpen[k] && !D.hist[k]){
    try{ const r = await sb.rpc("cast_customer_history", { p_res_id: Number(k) }); D.hist[k] = r.error ? { error: true } : (r.data || {}); }
    catch(e){ D.hist[k] = { error: true }; }
    render();
  }
}
/* ---------- 📝 お客さんメモ：画面いっぱいに開いて、テンプレの項目ごとに書く（2026/11/23 店長：スマホで書きやすく） ----------
   ・項目はキャストごと（⚙ 項目を変える）。はじめはムムのLINEの書き方
   ・「押すと入る言葉」で、打たなくても入る。年齢・見た目などは「前回のを入れる」
   ・書きかけは、この端末に残る（アプリを閉じても消えない。送ったら消える） */
let MK = null, MD = null;   // 開いている予約の ID・書いている中身
async function loadTpl(){
  if(D.tpl) return D.tpl;
  try{ const r = await sb.rpc("cast_memo_tpl"); D.tpl = (r.data && r.data.fields) || []; }catch(e){ D.tpl = []; }
  return D.tpl;
}
const draftKey = k => "kbCastMemoDraft_" + k;
async function openMemo(k){
  const r = D.res.find(x => String(x.id) === k); if(!r) return;
  await loadTpl();
  const m = D.memos[k] || {};
  let d = null; try{ d = JSON.parse(localStorage.getItem(draftKey(k)) || "null"); }catch(e){}
  MK = k;
  MD = d || { nick: m.nick || "", tags: (m.tags || []).filter(t => TAGS.includes(t)), shop: m.shop_note || "", body: m.body || "", vals: {} };
  if(MD.shop == null) MD.shop = "";
  if(!d) (m.fields || []).forEach(x => { MD.vals[x.label] = x.value || ""; });
  if(r.history && !D.hist[k]){ try{ const h = await sb.rpc("cast_customer_history", { p_res_id: Number(k) }); D.hist[k] = h.error ? { error: true } : (h.data || {}); }catch(e){ D.hist[k] = { error: true }; } }
  paintMemo();
  document.body.style.overflow = "hidden";
}
function prevMemo(){ const H = D.hist[MK]; return H && !H.error && (H.memos || [])[0] || null; }
function prevVal(label){ const p = prevMemo(); const f = p && (p.fields || []).find(x => x.label === label); return f ? String(f.value || "") : ""; }
function keepDraft(){ try{ localStorage.setItem(draftKey(MK), JSON.stringify(MD)); }catch(e){} }
function paintMemo(){
  const r = D.res.find(x => String(x.id) === MK), p = prevMemo(), T = D.tpl || [];
  const canPrev = p && (T.some(f => f.keep && prevVal(f.label) && !String(MD.vals[f.label] || "").trim()) || (p.nick && !MD.nick));
  let el = $("memoSheet"); if(!el){ el = document.createElement("div"); el.id = "memoSheet"; el.className = "sheet"; document.body.appendChild(el); }
  el.innerHTML = `<div class="sh-head"><button class="sh-x" onclick="closeMemo()">✕</button>
      <div><b>📝 ${esc(r.name || "お客")} さまのメモ</b><div class="muted">${esc(md(r.biz_date))} ${hmJ(r.start_at)}〜 ${esc(r.store)}</div></div></div>
    <div class="sh-body">
      ${canPrev ? `<button class="btn sky full" style="margin-bottom:10px" onclick="fillPrev()">📋 前回のメモ（${esc(md(p.biz_date))}）から、年齢・見た目などを入れる</button>` : ""}
      <label class="f-l">あだ名（自分用の呼び名）</label>
      <div style="display:flex;align-items:center;gap:4px"><span style="font-size:18px">「</span><input class="f-in" id="mf-nick" value="${esc(MD.nick)}" maxlength="40" oninput="MD.nick=this.value;keepDraft()"><span style="font-size:18px">」</span></div>
      ${T.map((f, i) => {
        const v = MD.vals[f.label] || "", pv = f.keep ? prevVal(f.label) : "";
        return `<label class="f-l">${esc(f.label)}</label>
          ${pv && !v.trim() ? `<div class="f-prev" onclick="setVal(${i}, ${esc(JSON.stringify(pv))})">前回：${esc(pv)} <b>＋入れる</b></div>` : ""}
          <textarea class="f-in" id="mf-${i}" rows="1" oninput="MD.vals[D.tpl[${i}].label]=this.value;grow(this);keepDraft()">${esc(v)}</textarea>
          ${(f.chips || []).length ? `<div class="f-chips">${f.chips.map(c => `<button onclick="addChip(${i}, ${esc(JSON.stringify(c))})">${esc(c)}</button>`).join("")}</div>` : ""}`;
      }).join("")}
      <label class="f-l">そのほか（自由に）</label>
      <textarea class="f-in" id="mf-body" rows="2" oninput="MD.body=this.value;grow(this);keepDraft()">${esc(MD.body)}</textarea>
      <label class="f-l">お店に伝えたいこと（NG・要注意のときだけ押す）</label>
      <div class="f-chips">${TAGS.map(t => `<button class="${MD.tags.includes(t) ? "on" : ""}" onclick="tagMemo(${esc(JSON.stringify(t))})">${esc(t)}</button>`).join("")}</div>
      ${MD.tags.length ? `<label class="f-l" style="color:#C62828">⚠ どんなことがあったか（必ず書いてください）</label>
        <textarea class="f-in" id="mf-shop" rows="2" style="border-color:#E57373" oninput="MD.shop=this.value;grow(this);keepDraft()" placeholder="お店に伝えたいことを書いてください">${esc(MD.shop)}</textarea>` : ""}
      <button class="tpl-btn" onclick="openTpl()">⚙ メモの項目を変える</button>
    </div>
    <div class="sh-foot"><button class="btn pink full" id="mf-save" onclick="saveMemo()">${(D.memos[MK] || {}).at ? "直してお店に送る" : "保存してお店に送る"}</button></div>`;
  el.querySelectorAll("textarea").forEach(grow);
}
function grow(t){ t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight, 44) + "px"; }
function setVal(i, v){ MD.vals[D.tpl[i].label] = v; keepDraft(); paintMemo(); }
function addChip(i, c){
  const t = $("mf-" + i), cur = t ? t.value : (MD.vals[D.tpl[i].label] || "");
  const v = cur && !/[\s、・]$/.test(cur) ? cur + "、" + c : cur + c;
  MD.vals[D.tpl[i].label] = v; if(t){ t.value = v; grow(t); } keepDraft();
}
function fillPrev(){
  const p = prevMemo(); if(!p) return;
  (D.tpl || []).forEach(f => { if(f.keep && !String(MD.vals[f.label] || "").trim()){ const v = prevVal(f.label); if(v) MD.vals[f.label] = v; } });
  if(!MD.nick && p.nick) MD.nick = p.nick;
  keepDraft(); paintMemo(); toast("前回のメモから入れました");
}
function tagMemo(t){ MD.tags = MD.tags.includes(t) ? MD.tags.filter(x => x !== t) : MD.tags.concat(t); keepDraft(); paintMemo(); }
function closeMemo(){ const el = $("memoSheet"); if(el) el.remove(); document.body.style.overflow = ""; MK = null; render(); }
async function saveMemo(){
  const b = $("mf-save"); if(b){ b.disabled = true; b.textContent = "送っています…"; }
  const fields = (D.tpl || []).map(f => ({ label: f.label, value: String(MD.vals[f.label] || "").trim() }));
  if(MD.tags.length && !String(MD.shop || "").trim()){ alert("「" + MD.tags.join("・") + "」を選んだときは、どんなことがあったかを書いてください"); if(b){ b.disabled = false; b.textContent = "保存してお店に送る"; } const t = $("mf-shop"); if(t) t.focus(); return; }
  try{
    const r = await sb.rpc("cast_memo_save", { p_res_id: Number(MK), p_tags: MD.tags, p_body: MD.body.trim(), p_fields: fields, p_nick: MD.nick.trim(), p_shop_note: MD.tags.length ? String(MD.shop || "").trim() : "" });
    if(r.error || (r.data && r.data.error)) throw new Error((r.error && r.error.message) || r.data.error);
    D.memos[MK] = { tags: MD.tags, shop_note: MD.tags.length ? String(MD.shop || "").trim() : "", body: MD.body.trim(), fields, nick: MD.nick.trim(), at: new Date().toISOString() };
    try{ localStorage.removeItem(draftKey(MK)); }catch(e){}
    toast("📝 お店に送りました"); closeMemo();
  }catch(e){ alert("送れませんでした：" + (e.message || e) + "\n（書いた内容はこの端末に残っています。電波のよいところで、もう一度押してください）"); if(b){ b.disabled = false; b.textContent = "もう一度送る"; } }
}
/* ---------- ⚙ メモの項目を変える（自分のテンプレ） ---------- */
let TP = null;
function openTpl(){ TP = JSON.parse(JSON.stringify(D.tpl || [])); paintTpl(); }
function paintTpl(){
  let el = $("tplSheet"); if(!el){ el = document.createElement("div"); el.id = "tplSheet"; el.className = "sheet"; el.style.zIndex = 12; document.body.appendChild(el); }
  el.innerHTML = `<div class="sh-head"><button class="sh-x" onclick="closeTpl()">✕</button><div><b>⚙ メモの項目</b><div class="muted">あなただけの項目です（ほかの人のメモは変わりません）</div></div></div>
    <div class="sh-body">${TP.map((f, i) => `<div class="tp-row">
        <div style="display:flex;gap:6px;align-items:center"><input class="f-in" value="${esc(f.label)}" maxlength="20" oninput="TP[${i}].label=this.value" placeholder="項目の名前">
          <button class="tp-b" onclick="tpMove(${i},-1)">↑</button><button class="tp-b" onclick="tpMove(${i},1)">↓</button><button class="tp-b" onclick="TP.splice(${i},1);paintTpl()">🗑</button></div>
        <input class="f-in" style="margin-top:6px" value="${esc((f.chips || []).join("、"))}" oninput="TP[${i}].chips=this.value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean)" placeholder="押すと入る言葉（「、」で区切る）例：早漏、遅漏">
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;margin-top:6px"><input type="checkbox" ${f.keep ? "checked" : ""} onchange="TP[${i}].keep=this.checked"> 前回のメモから引きつぐ（年齢・見た目など、変わらないもの）</label></div>`).join("")}
      <button class="btn soft full" onclick="TP.push({label:'',chips:[],keep:false});paintTpl()">＋ 項目を足す</button>
      <button class="btn soft full" style="margin-top:8px" onclick="tpReset()">↩ はじめの形にもどす</button></div>
    <div class="sh-foot"><button class="btn pink full" onclick="saveTpl()">💾 項目を保存</button></div>`;
}
function tpMove(i, d){ const j = i + d; if(j < 0 || j >= TP.length) return; [TP[i], TP[j]] = [TP[j], TP[i]]; paintTpl(); }
function closeTpl(){ const el = $("tplSheet"); if(el) el.remove(); }
async function saveTpl(){
  try{
    const r = await sb.rpc("cast_memo_tpl_save", { p_fields: TP.filter(f => String(f.label || "").trim()) });
    if(r.error || (r.data && r.data.error)) throw new Error((r.error && r.error.message) || r.data.error);
    D.tpl = r.data.fields; toast("⚙ 項目を保存しました"); closeTpl(); if(MK) paintMemo();
  }catch(e){ alert("保存できませんでした：" + (e.message || e)); }
}
async function tpReset(){
  if(!confirm("項目を、はじめの形にもどしますか？")) return;
  try{ await sb.rpc("cast_memo_tpl_save", { p_fields: null }); D.tpl = null; await loadTpl(); closeTpl(); if(MK) paintMemo(); toast("はじめの形にもどしました"); }
  catch(e){ alert("もどせませんでした：" + (e.message || e)); }
}
function resDetail(s){
  const rs = resOf(s);
  if(!rs.length) return `<div class="card detail"><h3>📖 ${md(s)}の予約</h3><div class="muted">この日の予約はありません</div></div>`;
  return `<div class="card detail"><h3>📖 ${md(s)}の予約 ${rs.filter(r => !OFF[r.status]).length}件</h3>${rs.map(resCard).join("")}</div>`;
}

/* ---------- わたしのバック表（店長が共有した一覧をそのまま）＋ 今の条件 ---------- */
let btSec = 0;
async function openBack(){
  seg = "back"; render();
  if(!D.back){
    try{ const r = await sb.rpc("cast_backsheet"); D.back = r.error ? { error: r.error.message } : (r.data || {}); }
    catch(e){ D.back = { error: e.message || e }; }
    render();
  }
}
function backHtml(){
  const B = D.back;
  let h = `<button class="back" onclick="setSeg('pay')">‹ 報酬にもどる</button><div class="card"><h3 style="font-size:15px;margin-bottom:8px">💗 わたしのバック表</h3>`;
  if(!B) return h + `<div class="muted">読みこみ中…</div></div>`;
  if(B.error) return h + `<div class="err">読めませんでした</div></div>`;
  const secs = []; let cur = null;
  String(B.body || "").split(/\r?\n/).forEach(l => {
    const t = l.trim(); if(!t) return;
    const m = t.match(/^【(.+)】$/);
    if(m){ cur = { name: m[1], lines: [] }; secs.push(cur); return; }
    if(!cur){ cur = { name: "バック", lines: [] }; secs.push(cur); }
    cur.lines.push(t);
  });
  if(btSec >= secs.length) btSec = 0;
  if(secs.length){
    h += `<div class="bt-pick">${secs.map((s, i) => `<button class="${i === btSec ? "on" : ""}" onclick="btSec=${i};render()">${esc(s.name)}</button>`).join("")}</div>`;
    h += secs[btSec].lines.map(l => { const mm = l.match(/^(.*?)[\s　]+([0-9０-９,，]+円.*)$/); return /^※|^（|^その他|ボーナス|同額/.test(l) || !mm ? `<div class="bt-note">${esc(l)}</div>` : `<div class="bt-row"><span>${esc(mm[1])}</span><b>${esc(mm[2])}</b></div>`; }).join("");
  } else h += `<div class="muted">まだ入っていません（お店に聞いてください）</div>`;
  h += `</div>`;
  if((B.rules || []).length) h += `<div class="card"><h3 style="font-size:15px;margin-bottom:8px">⭐ あなただけの条件</h3>${B.rules.map(r => `<div class="rule">${esc(r.note)}</div>`).join("")}</div>`;
  return h;
}

/* ---------- 画面 ---------- */
function render(){
  const segs = [["shift", "📅 シフト"], ["pay", "💴 報酬"], ["res", "📖 予約"]];
  const top = `<div class="seg">${segs.map(([k, l]) => `<button class="${seg === k || (seg === "back" && k === "pay") ? "on" : ""}" onclick="setSeg('${k}')">${l}</button>`).join("")}</div>`;
  if(seg === "back"){ $("view").innerHTML = top + backHtml(); return; }
  const days = Object.keys(D.weeks).length ? Array.from({ length: daysIn(Y, M) }, (_, i) => ymd(Y, M, i + 1)).filter(s => shiftOf(s)).length : 0;
  const paid = Object.values(D.settles).reduce((a, x) => a + (Number(x.take_home) || 0), 0);
  const wait = [...new Set(D.res.filter(r => !OFF[r.status] && !D.settles[r.biz_date] && r.biz_date >= APP_START).map(r => r.biz_date))].length;
  const cnt = D.res.filter(r => !OFF[r.status]).length;
  const sum = seg === "shift" ? `<div class="sum-bar"><div>${M}月の出勤<b>${days}日</b></div></div>`
            : seg === "pay" ? `<div class="sum-bar"><div>${M}月のお給料（確定分）<b>${yen(paid)}</b></div><div>まだの日<b>${wait}日</b></div></div>`
            : `<div class="sum-bar"><div>${M}月の予約<b>${cnt}件</b></div><div>メモを書いた<b>${Object.keys(D.memos).length}件</b></div></div>`;
  const detail = seg === "shift" ? shiftDetail(sel) : seg === "pay" ? payDetail(sel) : resDetail(sel);
  const extra = seg === "pay" ? `<button class="btn soft full" style="margin-bottom:12px" onclick="openBack()">💗 わたしのバック表・条件を見る</button>` : "";
  // 書きかけのメモは、描きなおしても消えないように
  const keep = {}; document.querySelectorAll("textarea[id^=memo-]").forEach(t => { keep[t.id] = t.value; });
  $("view").innerHTML = top + sum + calHtml() + `<div class="hint">日付をタップすると、下に出ます</div><div id="detail">${detail}</div>` + extra;
  Object.keys(keep).forEach(id => { const t = $(id); if(t) t.value = keep[id]; });
}
boot();
</script>
</body>
</html>
